name: Atualizar agenda de lançamentos

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: launch-data-refresh
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tech-camps-vercel
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run update-launches
      - name: Publicar snapshot atualizado no branch
        run: |
          if git diff --quiet -- public/data/launches.json; then
            echo "A agenda não mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/launches.json
          git commit -m "Atualizar agenda de lançamentos"
          git push origin HEAD:codex/tech-camps-vercel

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Run before rendering so a reload cannot restore the previous scroll position.
      history.scrollRestoration = 'manual';
      const navigation = performance.getEntriesByType('navigation')[0];
      if (navigation && navigation.type === 'reload') {
        history.replaceState(history.state, '', location.pathname + location.search);
      }
      window.scrollTo(0, 0);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Projeto educacional independente sobre a SpaceX: veículos, história, conectividade, impactos e uma simulação interativa de pouso." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/rocket.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/rocket-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SpaceX · Projeto educacional</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
